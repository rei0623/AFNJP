name: Sync Discord data

# チャンネル構成と最新の記事を channels.json / posts.json に自動反映する。
# 前提: リポジトリの Settings > Secrets and variables > Actions に
#       DISCORD_BOT_TOKEN を登録し、その Bot を AFNJP サーバーに招待しておく。
#       Bot に必要な権限は View Channels と Read Message History のみ。

on:
  schedule:
    - cron: '17 * * * *' # 毎時17分（UTC）
  workflow_dispatch: # 手動実行も可

permissions:
  contents: write

concurrency:
  group: sync-discord
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # push 失敗時に rebase で追いつけるよう、浅いクローンにしない
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      # カバー画像の WebP 変換に sharp を使う。
      # 依存はこれ1つで、サイト本体（配信されるファイル）には何も足さない。
      - name: Install dependencies
        run: npm ci

      - name: Sync from Discord
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: '1415350002255007784'
        run: node scripts/sync-discord.mjs

      # 記事一覧とチャンネル一覧を index.html へ静的に焼き込み、
      # 個別記事ページ（posts/）・archive.html・feed.xml・sitemap.xml も更新する。
      # JS を実行しない AI クローラー（GPTBot / ClaudeBot / PerplexityBot など）に読ませるため。
      # DISCORD_BOT_TOKEN は使わない（posts.json / channels.json を読むだけ）。
      # 失敗しても Discord データの同期は止めない。生成物は検証を通ってから書き込まれるので、
      # 途中で失敗した場合は index.html は前回の内容のまま残る。
      - name: Generate static HTML and feeds
        continue-on-error: true
        run: node scripts/generate-seo.mjs

      # 新しい記事の X 投稿用の下書きを組み立て、Discord の #x-下書き へ送る。
      # 失敗しても Discord データの同期は止めない。
      - name: Post X drafts to Discord
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: node scripts/post-x-drafts.mjs

      # #x-下書き で ✅ が付いた下書きだけを X へ投稿する。
      # ✅ を付けるのは人なので、承認しなければ何も出ない。
      # X の鍵（X_API_KEY など）が未設定のときは何もせず正常終了する。
      - name: Post approved drafts to X
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: node scripts/post-to-x.mjs

      # 新着記事があれば、サイトの通知を購読している人へプッシュを送る。
      # 送るのは「新着があった」という合図だけで、中身は各ブラウザの sw.js が組み立てる。
      # push-config.json が無効、または PUSH_SEND_TOKEN が未設定なら何もしない。
      - name: Send push notifications
        continue-on-error: true
        env:
          PUSH_SEND_TOKEN: ${{ secrets.PUSH_SEND_TOKEN }}
        run: node scripts/notify-push.mjs

      - name: Commit if changed
        run: |
          git add -A channels.json posts.json posts-archive.json assets/posts \
                    index.html archive.html posts feed.xml sitemap.xml \
                    .x-drafted.json .x-posted.json .push-sent.json
          if git diff --cached --quiet; then
            echo "変化なし。コミットしません。"
            exit 0
          fi
          git config user.name  "afnjp-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # [skip ci] は GitHub Actions 用、[skip render] は Render 用。
          # データ更新のたびに外部のデプロイが走らないようにする。
          git commit -m "chore: sync Discord data [skip ci] [skip render]"

          # 実行中に main が進んでいると push が弾かれるため、
          # rebase で追いついてから最大3回まで再試行する。
          for i in 1 2 3; do
            if git push; then
              echo "push しました（試行 $i 回目）"
              exit 0
            fi
            echo "push に失敗しました。main を取り込んで再試行します（$i/3）"
            git pull --rebase origin main || {
              echo "rebase に失敗しました。今回はスキップします。" >&2
              exit 1
            }
          done
          echo "3回試行しても push できませんでした。" >&2
          exit 1
