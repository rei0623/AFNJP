<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ページが見つかりません | AI Frontier News JP</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/AFNJP/AFNJP.jpg" type="image/jpeg">
    <style>
        :root {
            --paper: #fffefb;
            --ink: #111214;
            --ink-2: #4a4d52;
            --line: #e5e3dc;
            --shu: #d93a16;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: var(--paper);
            color: var(--ink);
            font-family: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
            padding: 24px;
        }

        main {
            max-width: 460px;
            text-align: center;
        }

        .code {
            font-family: "JetBrains Mono", ui-monospace, monospace;
            font-size: 3rem;
            font-weight: 700;
            color: var(--shu);
            letter-spacing: .06em;
        }

        h1 {
            font-size: 1.2rem;
            margin: 12px 0 8px;
        }

        p {
            color: var(--ink-2);
            font-size: .95rem;
            line-height: 1.8;
        }

        .actions {
            margin-top: 28px;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        a.btn {
            display: inline-block;
            padding: 10px 22px;
            border: 1px solid var(--line);
            border-radius: 6px;
            color: var(--ink);
            text-decoration: none;
            font-size: .9rem;
        }

        a.btn.primary {
            background: var(--ink);
            border-color: var(--ink);
            color: var(--paper);
        }
    </style>
</head>

<body>
    <main>
        <p class="code">404</p>
        <h1>ページが見つかりません</h1>
        <p>お探しのページは移動または削除された可能性があります。</p>
        <div class="actions">
            <a class="btn primary" href="/AFNJP/">トップページへ</a>
            <a class="btn" href="https://discord.gg/WUWE6Ev7yh" target="_blank" rel="noopener noreferrer">Discordで最新記事を読む</a>
        </div>
    </main>
</body>

</html>
